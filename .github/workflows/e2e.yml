name: Browser tests

on:
  schedule:
    # 17:00 UTC is 01:00 in Singapore.
    - cron: "0 17 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: browser
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'needs-test')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright WebKit
        run: pnpm exec playwright install webkit

      - name: Run browser tests
        run: pnpm e2e:web

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .playwright-results/
            playwright-report/

  # Separate job so PR code never runs with write access to issues.
  report-nightly-failure:
    name: report nightly failure
    needs: browser
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly browser tests failing"
          body="Nightly Browser tests failed on $(date -u +%F). Failing steps and traces: $RUN_URL (artifact playwright-results)."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label agent:codex --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label agent:codex --body "$body"
          fi
